# === ОДНОУЗЛОВОЙ KRAFT-BROKER ДЛЯ ОФИЦИАЛЬНОЙ ПРОВЕРКИ ===
#
# CHECK-ONLY: стенд проверки (compose из master репозитория курса) не содержит
# Kafka-брокера, а наш сервис построен вокруг outbox → Kafka → charge. Поэтому
# в контейнер orders встроен одноразовый single-node брокер (см.
# embedded-entrypoint.sh): при пустом KAFKA_BOOTSTRAP_SERVERS приложение
# подключается к нему же, на localhost:9092. В прод такое решение не идёт —
# брокер должен быть отдельным сервисом (локально он есть в docker-compose).

process.roles=broker,controller
node.id=1
controller.quorum.voters=1@localhost:9093

# Только localhost: контейнер один, продюсер и консюмер — внутри него же.
listeners=PLAINTEXT://localhost:9092,CONTROLLER://localhost:9093
advertised.listeners=PLAINTEXT://localhost:9092
controller.listener.names=CONTROLLER
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
inter.broker.listener.name=PLAINTEXT

# Хранилище в /tmp контейнера: данные однорозовые, контейнер живёт один прогон.
# docker kill + docker start (chaos S7/S8 задания 2) сохраняют fs контейнера,
# поэтому topic и смещения переживают перезапуск Orders.
log.dirs=/tmp/kafka-embedded-logs

# Однопартиционный топик и factor=1 — здесь один брокер, избыточность не нужна.
num.partitions=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
auto.create.topics.enable=true
group.initial.rebalance.delay.ms=0
