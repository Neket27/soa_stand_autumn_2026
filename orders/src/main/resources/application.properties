# Конфигурация сервиса заказов.# === ПЕРЕМЕННЫЕ ОКРУЖЕНИЯ ===# PORT — HTTP-порт (по умолчанию 8080)# DATABASE_URL — строка подключения к PostgreSQL# PAYMENT_URL — базовый URL сервиса Payment# INVENTORY_URL — базовый URL сервиса Inventory# KAFKA_BOOTSTRAP_SERVERS — адрес Kafka брокера# KAFKA_GROUP_ID — ID consumer-группы
# EVENTS_URL — базовый URL шины событий (задание 2)server.port=${PORT:8080}# DataSource настраивается в DataSourceConfig.java# spring.datasource.* удалены, чтобы не конфликтовать# Схема (schema.sql) применяется при старте: все команды идемпотентны# (IF NOT EXISTS), поэтому безопасно запускать при каждом запуске.# Нужно из-за кастомного DataSource — без этого флага Boot не применяет# schema.sql для не-встраиваемых БД.spring.sql.init.mode=always# Шедулер задач: у нас несколько фоновых процессов — OutboxDispatcher и# EventsPublisher (поллинг каждые 200 мс), Reaper (каждые 10 с), чистка# outbox (раз в час). Без пула они работали бы в одном потоке: долгий# вызов Payment в Reaper'е задерживал бы отправку событий.spring.task.scheduling.pool.size=6# Настройки Kafka — асинхронная оплата заказов (Producer в OutboxDispatcher,# Consumer в KafkaChargeDispatcher)spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}spring.kafka.consumer.group-id=${KAFKA_GROUP_ID:orders-charge}spring.kafka.consumer.auto-offset-reset=earliestspring.kafka.listener.ack-mode=manual