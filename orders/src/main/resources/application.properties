# Конфигурация сервиса заказов.
#
# === ПЕРЕМЕННЫЕ ОКРУЖЕНИЯ ===
#
# PORT — HTTP-порт (по умолчанию 8080)
# DATABASE_URL — строка подключения к PostgreSQL
# PAYMENT_URL — базовый URL сервиса Payment
# INVENTORY_URL — базовый URL сервиса Inventory
# ORDERS_DISPATCH — режим обработки платежей:
-- "kafka" — через Kafka (асинхронно)
-- "memory" — синхронный вызов (по умолчанию)
# KAFKA_BOOTSTRAP_SERVERS — адрес Kafka брокера
# KAFKA_GROUP_ID — ID consumer-группы

server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# Настройки Kafka (используются при ORDERS_DISPATCH=kafka)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_GROUP_ID:orders-charge}
spring.kafka.consumer.auto-offset-reset=earliest
