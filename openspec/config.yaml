# openspec/config.yaml
# Связка контекста с OpenSpec. context: инжектится во ВСЕ артефакты (держать коротким),
# rules: только в свой артефакт. Подробнее — в статье, шаг 3.
schema: spec-driven

context: |
  Продукт: учебный стенд курса «Архитектура микросервисов и SOA — осень 2026».
  Пишется один сервис — Orders (оформление заказов маркетплейса) — только в каталоге orders/.
  Стек сервиса: Java 21, Spring Boot 3.x, Maven, PostgreSQL 16, Docker (multi-stage).
  Остальной стенд (mocks, runner, cmd) — Go, read-only; менять запрещено, любое изменение
  вне orders/ проваливает задание на CI.
  Ключевое требование: ни одного двойного списания, деньги → paid, rejected → без денег и резерва,
  ответ на POST /orders ≤ 1 с (pending допустим), 5xx запрещены.

  Если описание в _raw/документах расходится с актуальным кодом — верь коду, спорное выноси человеку.

  Перед созданием ЛЮБОГО артефакта обязательно прочитай файлы из openspec/context:
  - 00-start-here.md, 01-product-context.md, 02-domain-glossary.md,
    03-architecture.md, 04-engineering-standards.md, 05-security-and-compliance.md,
    06-testing-and-quality.md, 07-anti-patterns.md
  Не хватает контекста — НЕ угадывай, сформулируй, какого.

rules:
  proposal:
    - Всегда заполняй Scope и Non-goals.
    - Меняется только orders/; всё остальное — read-only.
    - Противоречие требований — подними вопрос человеку.
  specs:
    - Если описание в _raw/документах расходится с кодом — верь коду. Используй Given/When/Then.
    - Сценарии пиши относительно контракта contracts/*.yaml и сценариев S1–S5 (docs/TASK_1.md).
  design:
    - Опирайся на инварианты из 03-architecture.md и релевантные ADR.
    - "Дизайн обязан явно отвечать: как соблюдается бюджет 1 с, как исключено двойное списание,
      как заказ с потерянным ответом станет paid, как ограничивается нагрузка на Payment в блэк-холе."
  tasks:
    - Не делай refactor вне задачи; deprecated из 07-anti-patterns.md запрещены.
    - Изменения только в orders/; после каждой задачи — `make scenarios ONLY=... WAIT=5`.
    - В каждой задаче — тесты (локальные и/или сценарий раннера, который её проверяет).
